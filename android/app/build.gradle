plugins {
    id "com.android.application"
}

def gameUrl = providers.gradleProperty("gameUrl").orElse("https://example.invalid").get()
def versionCodeValue = providers.gradleProperty("versionCode").orElse("1").get().toInteger()
def versionNameValue = providers.gradleProperty("versionName").orElse("1.0.0").get()

android {
    namespace "com.jimmyrahman.animalcup"
    compileSdk 35

    defaultConfig {
        applicationId "com.jimmyrahman.animalcup"
        minSdk 23
        targetSdk 35
        versionCode versionCodeValue
        versionName versionNameValue
        buildConfigField "String", "GAME_URL", '"' + gameUrl.replace("\\", "\\\\").replace('"', '\\\"') + '"'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.webkit:webkit:1.13.0"
}
